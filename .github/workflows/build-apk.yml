name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk APlay.apk

      - uses: actions/upload-artifact@v7
        with:
          name: APlay-apk
          path: APlay.apk
          if-no-files-found: error

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" APlay.apk \
            --title "APlay 1.0.${{ github.run_number }}" \
            --notes "Download APlay.apk and open it on your phone." \
            --target "${{ github.sha }}" \
          || gh release upload "v1.0.${{ github.run_number }}" APlay.apk --clobber
